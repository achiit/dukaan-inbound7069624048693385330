<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IG TECH LABS — Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brick:#C1443C;
    --cream:#F6EEE0;
    --mustard:#E8A93E;
    --ink:#1B1B1B;
    --teal:#1F6F63;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
  }
  .stage{
    position:relative;
    width:1080px;height:1920px;
    transform-origin:center;
    background:
      radial-gradient(circle at 20% 10%, rgba(232,169,62,0.15), transparent 40%),
      var(--brick);
    overflow:hidden;
  }
  /* Responsive scale-to-fit for preview */
  .scaler{
    transform:scale(0.32);
  }
  @media (max-width:1200px){
    .scaler{transform:scale(0.28);}
  }

  /* Texture: subtle diagonal paint strokes */
  .stage::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(135deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 40px);
    pointer-events:none;
  }

  /* Nail + string holding the board */
  .nail{
    position:absolute; top:64px; left:50%; transform:translateX(-50%);
    width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #eee, #888 70%, #333);
    box-shadow:0 4px 10px rgba(0,0,0,0.5);
    z-index:5;
  }

  /* ---------- SCENE 1: Board swings in ---------- */
  .board{
    position:absolute;
    top:150px; left:50%;
    width:880px;
    background:var(--cream);
    border:10px solid var(--ink);
    border-radius:14px;
    padding:70px 60px 90px;
    box-shadow:0 30px 60px rgba(0,0,0,0.45);
    transform-origin:top center;
    transform:translateX(-50%) rotate(-14deg);
    opacity:0;
    animation:swingIn 1.1s cubic-bezier(.34,1.56,.64,1) 0.15s forwards,
              sway 3.2s ease-in-out 1.3s infinite;
  }
  @keyframes swingIn{
    0%{opacity:0; transform:translateX(-50%) rotate(-30deg) translateY(-40px);}
    100%{opacity:1; transform:translateX(-50%) rotate(-2deg) translateY(0);}
  }
  @keyframes sway{
    0%,100%{transform:translateX(-50%) rotate(-2deg);}
    50%{transform:translateX(-50%) rotate(2deg);}
  }
  .string{
    position:absolute; top:90px; left:50%; transform:translateX(-50%);
    width:3px; height:70px; background:#333; z-index:4;
  }

  .eyebrow-tag{
    display:inline-block;
    background:var(--teal); color:var(--cream);
    font-family:'JetBrains Mono',monospace;
    font-weight:700; font-size:26px; letter-spacing:2px;
    padding:10px 24px; border-radius:6px;
    transform:rotate(-3deg);
    margin-bottom:34px;
    opacity:0;
    animation:fadeUp 0.6s ease 1.1s forwards;
  }

  .headline{
    font-family:'Kalam',cursive;
    font-weight:700;
    font-size:88px;
    line-height:1.05;
    color:var(--ink);
    margin-bottom:36px;
    opacity:0;
    animation:fadeUp 0.7s ease 1.35s forwards;
  }
  .headline .accent{ color:var(--brick); }

  .subline{
    font-family:'Poppins',sans-serif;
    font-weight:500;
    font-size:34px;
    color:#3a3a3a;
    line-height:1.5;
    opacity:0;
    animation:fadeUp 0.7s ease 1.6s forwards;
  }

  @keyframes fadeUp{
    0%{opacity:0; transform:translateY(24px);}
    100%{opacity:1; transform:translateY(0);}
  }

  /* ---------- SCENE 2: feature stamps ---------- */
  .stamps{
    position:absolute; top:1080px; left:0; right:0;
    display:flex; flex-direction:column; gap:34px;
    padding:0 100px;
  }
  .stamp{
    display:flex; align-items:center; gap:26px;
    opacity:0; transform:translateX(-60px) rotate(-3deg);
    animation:stampIn 0.55s ease forwards;
  }
  .stamp:nth-child(1){ animation-delay:2.0s; }
  .stamp:nth-child(2){ animation-delay:2.35s; }
  .stamp:nth-child(3){ animation-delay:2.7s; }
  @keyframes stampIn{
    0%{opacity:0; transform:translateX(-60px) rotate(-3deg);}
    100%{opacity:1; transform:translateX(0) rotate(0);}
  }
  .stamp .icon{
    flex-shrink:0;
    width:76px; height:76px; border-radius:50%;
    background:var(--mustard);
    display:flex; align-items:center; justify-content:center;
    font-size:38px; border:5px solid var(--ink);
  }
  .stamp .txt{
    font-family:'Poppins',sans-serif; font-weight:600;
    font-size:38px; color:var(--cream);
  }

  /* ---------- SCENE 3: price tag ---------- */
  .price-wrap{
    position:absolute; top:1420px; left:50%;
    transform:translateX(-50%);
    opacity:0;
    animation:tagIn 0.7s cubic-bezier(.34,1.56,.64,1) 3.1s forwards,
              tagSway 2.6s ease-in-out 3.9s infinite;
    transform-origin:top center;
  }
  @keyframes tagIn{
    0%{opacity:0; transform:translateX(-50%) translateY(-50px) rotate(0deg) scale(0.6);}
    100%{opacity:1; transform:translateX(-50%) translateY(0) rotate(6deg) scale(1);}
  }
  @keyframes tagSway{
    0%,100%{transform:translateX(-50%) rotate(6deg);}
    50%{transform:translateX(-50%) rotate(-4deg);}
  }
  .price-string{
    width:3px; height:50px; background:#333; margin:0 auto;
  }
  .price-tag{
    position:relative;
    width:420px;
    background:var(--mustard);
    border:6px solid var(--ink);
    border-radius:16px;
    padding:36px 30px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
  }
  .price-tag::before{
    content:"";
    position:absolute; top:-16px; left:50%; transform:translateX(-50%);
    width:20px; height:20px; border-radius:50%;
    background:var(--cream); border:5px solid var(--ink);
  }
  .price-tag .label{
    font-family:'JetBrains Mono',monospace;
    font-weight:700; font-size:24px; letter-spacing:2px;
    color:var(--ink); opacity:0.75;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .price-tag .amount{
    font-family:'Kalam',cursive; font-weight:700;
    font-size:76px; color:var(--brick);
    line-height:1;
  }
  .price-tag .amount span{ font-size:36px; }
  .price-tag .note{
    font-family:'Poppins',sans-serif; font-weight:500;
    font-size:22px; color:var(--ink); margin-top:10px;
  }

  /* ---------- SCENE 4: CTA footer ---------- */
  .cta{
    position:absolute; bottom:70px; left:0; right:0;
    text-align:center;
    opacity:0;
    animation:fadeUp 0.7s ease 4.5s forwards;
  }
  .cta .wa{
    text-decoration:none; cursor:pointer;
    display:inline-flex; align-items:center; gap:16px;
    background:var(--teal); color:var(--cream);
    font-family:'Poppins',sans-serif; font-weight:700;
    font-size:36px;
    padding:22px 44px; border-radius:60px;
    box-shadow:0 14px 30px rgba(0,0,0,0.35);
  }
  .cta .handle{
    display:block; margin-top:22px;
    font-family:'JetBrains Mono',monospace; font-weight:700;
    font-size:28px; color:var(--cream); letter-spacing:1px;
  }

  /* corner chip motif - tech meets shop sign */
  .chip{
    position:absolute; bottom:130px; right:-40px;
    width:220px; height:220px;
    opacity:0.14;
  }
</style>
</head>
<body>
<div class="scaler">
<div class="stage" id="stage">

  <div class="nail"></div>
  <div class="string"></div>

  <div class="board">
    <span class="eyebrow-tag">IG TECH LABS</span>
    <div class="headline">Your shop<br>deserves a<br><span class="accent">real website.</span></div>
    <div class="subline">Not just a Google Maps pin.</div>
  </div>

  <div class="stamps">
    <div class="stamp"><div class="icon">📱</div><div class="txt">Works perfectly on mobile</div></div>
    <div class="stamp"><div class="icon">💬</div><div class="txt">Orders straight to WhatsApp</div></div>
    <div class="stamp"><div class="icon">⚡</div><div class="txt">Delivered in 48 hours</div></div>
  </div>

  <div class="price-wrap">
    <div class="price-string"></div>
    <div class="price-tag">
      <div class="label">Starting at</div>
      <div class="amount"><span>₹</span>2,999</div>
      <div class="note">One-time · yours forever</div>
    </div>
  </div>

  <div class="cta">
    <a class="wa" href="https://wa.me/918411930862?text=Hi!%20I%20saw%20your%20reel%2C%20I%20want%20a%20website%20for%20my%20shop" target="_blank" rel="noopener">💬 Message us on WhatsApp</a>
    <span class="handle">@ig_tech_labs · +91 84119 30862</span>
  </div>

  <svg class="chip" viewBox="0 0 100 100"><rect x="30" y="30" width="40" height="40" rx="4" fill="none" stroke="#F6EEE0" stroke-width="4"/><line x1="30" y1="45" x2="10" y2="45" stroke="#F6EEE0" stroke-width="4"/><line x1="30" y1="55" x2="10" y2="55" stroke="#F6EEE0" stroke-width="4"/><line x1="70" y1="45" x2="90" y2="45" stroke="#F6EEE0" stroke-width="4"/><line x1="70" y1="55" x2="90" y2="55" stroke="#F6EEE0" stroke-width="4"/><line x1="45" y1="30" x2="45" y2="10" stroke="#F6EEE0" stroke-width="4"/><line x1="55" y1="30" x2="55" y2="10" stroke="#F6EEE0" stroke-width="4"/><line x1="45" y1="70" x2="45" y2="90" stroke="#F6EEE0" stroke-width="4"/><line x1="55" y1="70" x2="55" y2="90" stroke="#F6EEE0" stroke-width="4"/></svg>

</div>
</div>

<script>
  // Loop the whole sequence
  const stage = document.getElementById('stage');
  const LOOP_MS = 8000;
  function restart(){
    stage.style.animation = 'none';
    void stage.offsetWidth;
    stage.querySelectorAll('*').forEach(el=>{
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = '';
    });
  }
  setInterval(restart, LOOP_MS);
</script>
</body>
</html>
